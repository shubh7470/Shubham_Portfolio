<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#080c15"/>
      <stop offset="100%" stop-color="#03050a"/>
    </linearGradient>

    <!-- Text / Accent Gradients -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(139, 92, 246, 0.4)"/>
      <stop offset="50%" stop-color="rgba(56, 189, 248, 0.2)"/>
      <stop offset="100%" stop-color="rgba(236, 72, 153, 0.3)"/>
    </linearGradient>

    <!-- Glow Blur -->
    <filter id="bgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#ogBg)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="150" r="250" fill="#3b82f6" opacity="0.18" filter="url(#bgGlow)"/>
  <circle cx="1000" cy="450" r="280" fill="#8b5cf6" opacity="0.16" filter="url(#bgGlow)"/>
  <circle cx="600" cy="300" r="200" fill="#06b6d4" opacity="0.12" filter="url(#bgGlow)"/>

  <!-- Technical Grid Overlay -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200"/>
    <path d="M200 0 V630 M400 0 V630 M600 0 V630 M800 0 V630 M1000 0 V630"/>
  </g>

  <!-- Main Card Container -->
  <rect x="60" y="50" width="1080" height="530" rx="28" fill="rgba(15, 23, 42, 0.6)" stroke="url(#cardBorder)" stroke-width="2"/>

  <!-- Header Badge: Available for Work -->
  <g transform="translate(100, 105)">
    <rect width="210" height="38" rx="19" fill="rgba(139, 92, 246, 0.15)" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1"/>
    <circle cx="24" cy="19" r="5" fill="#10b981"/>
    <text x="38" y="24" font-family="'Space Grotesk', system-ui, sans-serif" font-size="14" font-weight="700" fill="#a78bfa" letter-spacing="0.5">AVAILABLE FOR WORK</text>
  </g>

  <!-- Domain Badge Top Right -->
  <g transform="translate(900, 105)">
    <rect width="180" height="38" rx="19" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
    <text x="90" y="24" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="15" font-weight="700" fill="#38bdf8">shubhammourya.in</text>
  </g>

  <!-- Main Name Title -->
  <text x="100" y="245" font-family="'Space Grotesk', system-ui, sans-serif" font-size="68" font-weight="800" fill="url(#nameGrad)" letter-spacing="-1">
    SHUBHAM MOURYA
  </text>

  <!-- Subtitle Role -->
  <text x="100" y="300" font-family="'Inter', system-ui, sans-serif" font-size="28" font-weight="600" fill="#e2e8f0" letter-spacing="-0.3">
    Full Stack &amp; Mobile App Developer
  </text>

  <!-- Description -->
  <text x="100" y="345" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
    Specializing in React Native, Next.js, Node.js &amp; PostgreSQL. Building high-performance apps.
  </text>

  <!-- Tech Stack Pills -->
  <g transform="translate(100, 395)">
    <!-- Pill 1: React Native -->
    <rect x="0" y="0" width="145" height="42" rx="12" fill="rgba(59, 130, 246, 0.15)" stroke="rgba(59, 130, 246, 0.3)" stroke-width="1"/>
    <text x="72.5" y="26" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="15" font-weight="600" fill="#60a5fa">React Native</text>

    <!-- Pill 2: Next.js -->
    <rect x="160" y="0" width="115" height="42" rx="12" fill="rgba(6, 182, 212, 0.15)" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1"/>
    <text x="217.5" y="26" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="15" font-weight="600" fill="#67e8f9">Next.js</text>

    <!-- Pill 3: Node.js -->
    <rect x="290" y="0" width="115" height="42" rx="12" fill="rgba(34, 197, 94, 0.15)" stroke="rgba(34, 197, 94, 0.3)" stroke-width="1"/>
    <text x="347.5" y="26" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="15" font-weight="600" fill="#4ade80">Node.js</text>

    <!-- Pill 4: PostgreSQL -->
    <rect x="420" y="0" width="135" height="42" rx="12" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(99, 102, 241, 0.3)" stroke-width="1"/>
    <text x="487.5" y="26" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="15" font-weight="600" fill="#818cf8">PostgreSQL</text>

    <!-- Pill 5: TypeScript -->
    <rect x="570" y="0" width="135" height="42" rx="12" fill="rgba(168, 85, 247, 0.15)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1"/>
    <text x="637.5" y="26" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="15" font-weight="600" fill="#c084fc">TypeScript</text>
  </g>

  <!-- Featured Apps Section Footer Bar -->
  <g transform="translate(100, 485)">
    <line x1="0" y1="0" x2="1000" y2="0" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="0" y="32" font-family="'Space Grotesk', system-ui, sans-serif" font-size="14" font-weight="700" fill="#64748b" letter-spacing="1">FEATURED APPS:</text>
    <text x="140" y="32" font-family="'Space Grotesk', system-ui, sans-serif" font-size="15" font-weight="700" fill="#38bdf8">Karmanisht</text>
    <text x="250" y="32" font-family="'Space Grotesk', system-ui, sans-serif" font-size="15" font-weight="500" fill="#64748b">•</text>
    <text x="270" y="32" font-family="'Space Grotesk', system-ui, sans-serif" font-size="15" font-weight="700" fill="#a78bfa">Hindustan Mart</text>
    <text x="415" y="32" font-family="'Space Grotesk', system-ui, sans-serif" font-size="15" font-weight="500" fill="#64748b">•</text>
    <text x="435" y="32" font-family="'Space Grotesk', system-ui, sans-serif" font-size="15" font-weight="700" fill="#34d399">Edusathi LMS</text>
  </g>
</svg>
